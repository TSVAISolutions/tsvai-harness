name: Build CLI

on:
  push:
    branches: [main]
    paths:
      - 'ai/cli/**'
      - '.github/workflows/build-cli.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and release TSVAI CLI
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: ai/cli
        run: bun install

      - name: Build CLI
        working-directory: ai/cli
        run: |
          bun run build
          bun run build:standalone

      - name: Verify standalone bundle
        run: |
          if [ -f ai/cli/packages/cli/dist-standalone/vega.mjs ]; then
            ls -lh ai/cli/packages/cli/dist-standalone/vega.mjs
          else
            echo "Error: Standalone bundle not found"
            exit 1
          fi

      - name: Generate SHA256 checksum
        run: |
          cd ai/cli/packages/cli/dist-standalone
          sha256sum vega.mjs > tsvai.mjs.sha256
          mv vega.mjs tsvai.mjs
          cat tsvai.mjs.sha256

      - name: Release if CLI version is new
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(cat ai/cli/package.json | grep '"version"' | head -1 | sed 's/.*"version": "\([^"]*\)".*/\1/')
          TAG="cli-v${VERSION}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — skipping."
            exit 0
          fi

          echo "Creating release $TAG..."
          gh release create "$TAG" \
            --title "TSVAI CLI v${VERSION}" \
            --notes "Automated release of TSVAI CLI v${VERSION}." \
            ai/cli/packages/cli/dist-standalone/tsvai.mjs \
            ai/cli/packages/cli/dist-standalone/tsvai.mjs.sha256

      - name: Upload workflow_dispatch artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: tsvai-cli
          path: |
            ai/cli/packages/cli/dist-standalone/tsvai.mjs
            ai/cli/packages/cli/dist-standalone/tsvai.mjs.sha256

  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: ai/cli
        run: bun install

      - name: Lint
        working-directory: ai/cli
        run: bun run lint

      - name: Type check
        working-directory: ai/cli
        run: bun run typecheck

  test:
    name: Test CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: ai/cli
        run: bun install

      - name: Run tests
        working-directory: ai/cli
        run: bun run test
