apiVersion: v1
kind: Namespace
metadata:
  name: harness-factory
  labels:
    name: harness-factory
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: harness-factory-quota
  namespace: harness-factory
spec:
  hard:
    requests.cpu: "4"
    requests.memory: "8Gi"
    limits.cpu: "8"
    limits.memory: "16Gi"
    pods: "20"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: harness-factory-limits
  namespace: harness-factory
spec:
  limits:
  - max:
      cpu: "2"
      memory: "4Gi"
    min:
      cpu: "100m"
      memory: "128Mi"
    type: Container
  - max:
      cpu: "4"
      memory: "8Gi"
    min:
      cpu: "200m"
      memory: "256Mi"
    type: Pod
