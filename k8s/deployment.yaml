apiVersion: apps/v1
kind: Deployment
metadata:
  name: tsvai-harness
  namespace: tsvai
  labels:
    app: tsvai-harness
    version: v1
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: tsvai-harness
  template:
    metadata:
      labels:
        app: tsvai-harness
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/api/metrics"
    spec:
      serviceAccountName: tsvai-harness
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000

      initContainers:
      - name: init-brain-wiki
        image: busybox:latest
        command: ['sh', '-c', 'mkdir -p /data/brain-wiki && chmod 777 /data/brain-wiki']
        volumeMounts:
        - name: brain-wiki-storage
          mountPath: /data/brain-wiki

      containers:
      - name: tsvai-harness
        image: tsvai-harness:latest
        imagePullPolicy: Never  # For local development
        ports:
        - name: api
          containerPort: 3000
          protocol: TCP
        - name: dashboard
          containerPort: 3001
          protocol: TCP

        env:
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: tsvai-config
              key: NODE_ENV
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: tsvai-config
              key: LOG_LEVEL
        - name: HARNESS_PORT
          valueFrom:
            configMapKeyRef:
              name: tsvai-config
              key: HARNESS_PORT
        - name: DASHBOARD_PORT
          valueFrom:
            configMapKeyRef:
              name: tsvai-config
              key: DASHBOARD_PORT
        - name: BRAIN_WIKI_DB_PATH
          valueFrom:
            configMapKeyRef:
              name: tsvai-config
              key: BRAIN_WIKI_DB_PATH
        - name: WORKFLOW_TIMEOUT
          valueFrom:
            configMapKeyRef:
              name: tsvai-config
              key: WORKFLOW_TIMEOUT

        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 2Gi

        livenessProbe:
          httpGet:
            path: /api/health
            port: api
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /api/ready
            port: api
            scheme: HTTP
          initialDelaySeconds: 15
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2

        startupProbe:
          httpGet:
            path: /api/ready
            port: api
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 2
          timeoutSeconds: 3
          failureThreshold: 30

        volumeMounts:
        - name: brain-wiki-storage
          mountPath: /data/brain-wiki
        - name: logs
          mountPath: /var/log/tsvai

        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "sleep 15"]

      volumes:
      - name: brain-wiki-storage
        emptyDir: {}
        # For persistent storage, use:
        # persistentVolumeClaim:
        #   claimName: brain-wiki-pvc
      - name: logs
        emptyDir: {}

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - tsvai-harness
              topologyKey: kubernetes.io/hostname

      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tsvai-harness
  namespace: tsvai
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tsvai-harness
  namespace: tsvai
rules:
- apiGroups: [""]
  resources: ["pods", "services"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tsvai-harness
  namespace: tsvai
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tsvai-harness
subjects:
- kind: ServiceAccount
  name: tsvai-harness
  namespace: tsvai
