apiVersion: v1
kind: Service
metadata:
  name: harness-factory-api
  namespace: harness-factory
  labels:
    app: harness-factory
    component: api
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 3000
    targetPort: api
    protocol: TCP
  selector:
    app: harness-factory
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
---
apiVersion: v1
kind: Service
metadata:
  name: harness-factory-loadbalancer
  namespace: harness-factory
  labels:
    app: harness-factory
spec:
  type: LoadBalancer
  ports:
  - name: api
    port: 80
    targetPort: api
    protocol: TCP
  selector:
    app: harness-factory
---
apiVersion: v1
kind: Service
metadata:
  name: harness-factory-nodeport
  namespace: harness-factory
  labels:
    app: harness-factory
spec:
  type: NodePort
  ports:
  - name: api
    port: 3000
    targetPort: api
    nodePort: 30000
    protocol: TCP
  selector:
    app: harness-factory
